name: SofaScore live probe

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Chelsea preseason structured spatial coverage
        shell: python
        run: |
          import json
          import time
          import urllib.error
          import urllib.request

          BASES = [
              "https://www.sofascore.com/api/v1",
              "https://api.sofascore.com/api/v1",
          ]
          CHELSEA_ID = 38
          DATES = [
              "2026-08-15",
              "2026-08-09",
              "2026-08-08",
              "2026-08-05",
              "2026-08-01",
          ]
          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/151.0.0.0 Safari/537.36"
              ),
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.sofascore.com/",
              "Origin": "https://www.sofascore.com",
          }

          def get(base, path):
              url = f"{base}/{path}"
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      print(f"OK host={base} status={response.status} path={path}")
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  print(f"HTTP {exc.code} host={base} path={path}")
                  return None
              except Exception as exc:
                  print(f"ERROR {type(exc).__name__} host={base} path={path}: {exc}")
                  return None

          working_base = None
          found = []
          for base in BASES:
              print(f"TRY_BASE={base}")
              for date in DATES:
                  payload = get(base, f"sport/football/scheduled-events/{date}") or {}
                  events = payload.get("events", [])
                  if events and working_base is None:
                      working_base = base
                  for event in events:
                      home = event.get("homeTeam", {})
                      away = event.get("awayTeam", {})
                      if CHELSEA_ID in {home.get("id"), away.get("id")}:
                          found.append((base, event))
                          print(
                              f"FOUND base={base} date={date} event={event.get('id')} "
                              f"{home.get('name')} vs {away.get('name')}"
                          )
                  time.sleep(0.5)
              if found:
                  break

          print(f"WORKING_BASE={working_base}")
          print(f"TOTAL_CHELSEA_EVENTS={len(found)}")

          heatmaps_found = 0
          for base, event in found:
              event_id = event["id"]
              home_is_chelsea = event.get("homeTeam", {}).get("id") == CHELSEA_ID
              side = "home" if home_is_chelsea else "away"
              lineups = get(base, f"event/{event_id}/lineups") or {}
              players = (lineups.get(side) or {}).get("players", [])
              starters = [p for p in players if p.get("substitute") is not True]
              print(f"LINEUP event={event_id} side={side} starters={len(starters)}")

              for item in starters:
                  player = item.get("player") or {}
                  player_id = player.get("id")
                  name = player.get("name")
                  position = player.get("position")
                  if not player_id:
                      continue
                  data = get(base, f"event/{event_id}/player/{player_id}/heatmap") or {}
                  points = data.get("heatmap") or []
                  if points:
                      heatmaps_found += 1
                      valid = [p for p in points if "x" in p and "y" in p]
                      xs = [float(p["x"]) for p in valid]
                      ys = [float(p["y"]) for p in valid]
                      print(
                          f"HEATMAP event={event_id} player={player_id} "
                          f"name={name!r} pos={position!r} n={len(xs)} "
                          f"avg_x={sum(xs)/len(xs):.2f} avg_y={sum(ys)/len(ys):.2f} "
                          f"x_range=({min(xs):.1f},{max(xs):.1f}) "
                          f"y_range=({min(ys):.1f},{max(ys):.1f})"
                      )
                  else:
                      print(
                          f"NO_HEATMAP event={event_id} player={player_id} "
                          f"name={name!r} pos={position!r}"
                      )
                  time.sleep(0.5)

          print(f"TOTAL_HEATMAPS={heatmaps_found}")
