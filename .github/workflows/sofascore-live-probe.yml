name: SofaScore live probe

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Chelsea preseason structured spatial coverage
        shell: python
        run: |
          import json
          import time
          import urllib.error
          import urllib.request

          BASE = "https://api.sofascore.com/api/v1"
          CHELSEA_ID = 38
          DATES = [
              "2026-08-15",
              "2026-08-09",
              "2026-08-08",
              "2026-08-05",
              "2026-08-01",
          ]

          def get(path):
              url = f"{BASE}/{path}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 fpl-model research probe",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  print(f"HTTP {exc.code}: {path}")
                  return None
              except Exception as exc:
                  print(f"ERROR {type(exc).__name__}: {path}: {exc}")
                  return None

          found = []
          for date in DATES:
              payload = get(f"sport/football/scheduled-events/{date}") or {}
              events = payload.get("events", [])
              for event in events:
                  home = event.get("homeTeam", {})
                  away = event.get("awayTeam", {})
                  if CHELSEA_ID in {home.get("id"), away.get("id")}:
                      found.append(event)
                      print(
                          f"FOUND date={date} event={event.get('id')} "
                          f"{home.get('name')} vs {away.get('name')}"
                      )
              time.sleep(0.4)

          print(f"TOTAL_CHELSEA_EVENTS={len(found)}")

          heatmaps_found = 0
          for event in found:
              event_id = event["id"]
              home_is_chelsea = event.get("homeTeam", {}).get("id") == CHELSEA_ID
              side = "home" if home_is_chelsea else "away"
              lineups = get(f"event/{event_id}/lineups") or {}
              players = (lineups.get(side) or {}).get("players", [])
              starters = [p for p in players if p.get("substitute") is not True]
              print(f"LINEUP event={event_id} side={side} starters={len(starters)}")

              for item in starters:
                  player = item.get("player") or {}
                  player_id = player.get("id")
                  name = player.get("name")
                  position = player.get("position")
                  if not player_id:
                      continue
                  data = get(f"event/{event_id}/player/{player_id}/heatmap") or {}
                  points = data.get("heatmap") or []
                  if points:
                      heatmaps_found += 1
                      xs = [float(p["x"]) for p in points if "x" in p and "y" in p]
                      ys = [float(p["y"]) for p in points if "x" in p and "y" in p]
                      print(
                          f"HEATMAP event={event_id} player={player_id} "
                          f"name={name!r} pos={position!r} n={len(xs)} "
                          f"avg_x={sum(xs)/len(xs):.2f} avg_y={sum(ys)/len(ys):.2f} "
                          f"x_range=({min(xs):.1f},{max(xs):.1f}) "
                          f"y_range=({min(ys):.1f},{max(ys):.1f})"
                      )
                  else:
                      print(
                          f"NO_HEATMAP event={event_id} player={player_id} "
                          f"name={name!r} pos={position!r}"
                      )
                  time.sleep(0.35)

          print(f"TOTAL_HEATMAPS={heatmaps_found}")
