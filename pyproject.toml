[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-model"
version = "0.1.0"
description = "Explainable Fantasy Premier League projection and context engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.5,<2",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
